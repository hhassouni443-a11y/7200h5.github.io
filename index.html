<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة إدارة شراكة التداول</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen font-sans transition-colors duration-200">

    <!-- Navigation Bar -->
    <nav class="bg-white dark:bg-gray-800 shadow-md border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3 space-x-reverse">
                    <span class="text-2xl font-bold text-brand-600 dark:text-brand-500">📈 محفظة الشراكة</span>
                </div>
                <div class="flex items-center space-x-4 space-x-reverse">
                    <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200">
                        🌙 / ☀️
                    </button>
                    <button id="logout-btn" onclick="logout()" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium">
                        تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Login View -->
        <div id="login-section" class="max-w-md mx-auto bg-white dark:bg-gray-800 p-8 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700">
            <h2 class="text-2xl font-bold text-center mb-6">تسجيل الدخول للمنظومة</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">اسم المستخدم</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 rounded-lg border dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-brand-500">
                </div>
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 rounded-lg transition duration-200">دخول</button>
                <div id="login-error" class="text-red-500 text-sm text-center hidden"></div>
            </form>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-section" class="hidden space-y-8">
            
            <!-- User Info Header -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold">مرحباً بك، <span id="user-display-name"></span></h1>
                    <p class="text-sm text-gray-500 dark:text-gray-400" id="user-role-badge"></p>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow border-r-4 border-blue-500">
                    <p class="text-sm text-gray-500 dark:text-gray-400">رأس المال الحالي</p>
                    <h3 class="text-2xl font-bold mt-1" id="stat-capital">$0.00</h3>
                </div>
                <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow border-r-4 border-green-500">
                    <p class="text-sm text-gray-500 dark:text-gray-400">نسبة المساهمة</p>
                    <h3 class="text-2xl font-bold mt-1" id="stat-share">0%</h3>
                </div>
                <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow border-r-4 border-emerald-500">
                    <p class="text-sm text-gray-500 dark:text-gray-400">صافي الأرباح/الخسائر</p>
                    <h3 class="text-2xl font-bold mt-1" id="stat-net-profit">$0.00</h3>
                </div>
                <div class="bg-white dark:bg-gray-800 p-5 rounded-xl shadow border-r-4 border-purple-500" id="admin-extra-stat">
                    <p class="text-sm text-gray-500 dark:text-gray-400">عدد المستثمرين</p>
                    <h3 class="text-2xl font-bold mt-1" id="stat-investor-count">0</h3>
                </div>
            </div>

            <!-- Admin Controls -->
            <div id="admin-controls" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Add Investor -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
                    <h3 class="text-lg font-bold mb-4">➕ إضافة مستثمر جديد</h3>
                    <form onsubmit="handleAddInvestor(event)" class="space-y-3">
                        <input type="text" id="inv-fullname" placeholder="الاسم الكامل" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <input type="text" id="inv-username" placeholder="اسم المستخدم" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <input type="password" id="inv-password" placeholder="كلمة المرور" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <input type="number" step="0.01" id="inv-capital" placeholder="رأس المال الأصلي ($)" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">إضافة المستثمر</button>
                    </form>
                </div>

                <!-- Record Profit/Loss -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow">
                    <h3 class="text-lg font-bold mb-4">⚖️ تسجيل وتوزيع أرباح/خسائر</h3>
                    <form onsubmit="handleDistribution(event)" class="space-y-3">
                        <select id="dist-type" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                            <option value="profit">أرباح (+)</option>
                            <option value="loss">خسائر (-)</option>
                        </select>
                        <input type="number" step="0.01" id="dist-amount" placeholder="إجمالي المبلغ ($)" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <input type="number" step="0.1" id="dist-fee" placeholder="نسبة الإدارة (10% - 20%)" value="15" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <input type="text" id="dist-note" placeholder="ملاحظة / اسم الصفقة" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-2 rounded hover:bg-emerald-700">اعتماد وتوزيع</button>
                    </form>
                </div>
            </div>

            <!-- Transactions Log -->
            <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow overflow-x-auto">
                <h3 class="text-lg font-bold mb-4">📜 سجل العمليات والحركات المالية</h3>
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b dark:border-gray-700 text-gray-500 dark:text-gray-400">
                            <th class="p-3">التاريخ</th>
                            <th class="p-3">النوع</th>
                            <th class="p-3">الملاحظات</th>
                            <th class="p-3">الحصة/الصافي</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table"></tbody>
                </table>
            </div>

        </div>
    </main>

    <script>
        let currentUser = null;

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value;
            const p = document.getElementById('login-password').value;
            if(u === 'admin' && p === 'admin123') {
                currentUser = { full_name: 'المالك الرئيسي', role: 'admin', current_capital: 50 };
                showDashboard();
            } else {
                document.getElementById('login-error').innerText = 'بيانات الدخول غير صحيحة';
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = currentUser.full_name;
            document.getElementById('user-role-badge').innerText = currentUser.role === 'admin' ? 'المالك والمدير الرئيسي' : 'مستثمر';
            document.getElementById('stat-capital').innerText = `$${currentUser.current_capital.toFixed(2)}`;
            if (currentUser.role === 'admin') {
                document.getElementById('admin-controls').classList.remove('hidden');
            }
        }

        function handleAddInvestor(e) {
            e.preventDefault();
            alert('تمت إضافة المستثمر بنجاح');
            e.target.reset();
        }

        function handleDistribution(e) {
            e.preventDefault();
            alert('تم التوزيع وحساب المبالغ بنجاح');
            e.target.reset();
        }
    </script>
</body>
</html>
